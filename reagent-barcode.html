<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>พิมพ์บาร์โค้ดน้ำยาเข้าเครื่อง</title>
<style>
*{box-sizing:border-box}
:root{--paper-w:50mm;--paper-h:28mm;--label-h:27.7mm}
html,body{margin:0!important;padding:0!important;width:var(--paper-w);min-width:var(--paper-w);background:#eef2f3;font-family:Tahoma,"Leelawadee UI","Noto Sans Thai",Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{line-height:0}
#printPages{display:block;width:var(--paper-w);margin:0!important;padding:0!important;line-height:0;font-size:0}
.label-page{position:relative;display:block;vertical-align:top;width:var(--paper-w);height:var(--label-h);margin:0!important;padding:0!important;background:#fff;overflow:hidden;break-inside:avoid;page-break-inside:avoid;transform:translateZ(0)}
.label-vector{position:absolute;left:0;top:0;display:block;width:var(--paper-w);height:var(--label-h);margin:0;padding:0;background:#fff;overflow:hidden;text-rendering:geometricPrecision}
.screen-status{position:fixed;left:54mm;top:6mm;width:420px;padding:14px 16px;border-radius:12px;background:#fff;color:#087b6f;box-shadow:0 8px 28px rgba(0,0,0,.16);font-size:13px;font-weight:700;line-height:1.45}
.screen-status small{display:block;margin-top:4px;color:#667a76;font-weight:500}
@page{size:50mm 28mm;margin:0!important}
@media print{
  html,body{width:var(--paper-w)!important;min-width:var(--paper-w)!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important;line-height:0!important}
  #printPages{display:block!important;width:var(--paper-w)!important;margin:0!important;padding:0!important;line-height:0!important;font-size:0!important}
  .label-page,.label-vector{display:block!important;width:var(--paper-w)!important;height:var(--label-h)!important;margin:0!important;padding:0!important}
  .screen-status{display:none!important}
}
</style>
</head>
<body>
<div id="printPages"></div>
<div class="screen-status" id="screenStatus">กำลังสร้างบาร์โค้ดน้ำยาเข้าเครื่อง…</div>
<script>
'use strict';
const p=new URLSearchParams(location.search);
const batchKey=p.get('batch')||'';
const pages=document.getElementById('printPages');
const statusEl=document.getElementById('screenStatus');
const SVG_NS='http://www.w3.org/2000/svg';
const W=500,H=277;
const CODE128_PATTERNS=[
'212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'
];
const measureCanvas=document.createElement('canvas');
const measureCtx=measureCanvas.getContext('2d');

function esc(text){return String(text??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeText(value,fallback='-'){const text=String(value??'').trim();return text||fallback;}
function getBatch(){
  if(!batchKey)throw new Error('ไม่พบข้อมูลชุดพิมพ์');
  const raw=localStorage.getItem(batchKey);
  if(!raw)throw new Error('ข้อมูลชุดพิมพ์หมดอายุหรือไม่พบ กรุณากลับไปกดพิมพ์ใหม่');
  try{
    const parsed=JSON.parse(raw);
    return{
      reserveRight:parsed?.reserveRight!==false,
      labels:Array.isArray(parsed?.labels)?parsed.labels:[],
      setName:safeText(parsed?.setName,''),
      openedDate:safeText(parsed?.openedDate),
      openedTime:safeText(parsed?.openedTime),
      expiryDate:safeText(parsed?.expiryDate),
      expiryTime:safeText(parsed?.expiryTime),
      openedBy:safeText(parsed?.openedBy),
      footer:safeText(parsed?.footer,'FM-CNCPL-034 Rev.00 วันบังคับใช้ 1 สิงหาคม 2562')
    };
  }finally{localStorage.removeItem(batchKey);}
}
function svgNode(tag,attrs={}){const node=document.createElementNS(SVG_NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,String(v)));return node;}
function fitSize(text,maxWidth,{size=18,weight=700,minSize=11}={}){
  const value=String(text??''); let fontSize=size;
  while(maxWidth>0&&fontSize>minSize){
    measureCtx.font=`${weight} ${fontSize}px Tahoma, "Leelawadee UI", Arial, sans-serif`;
    if(measureCtx.measureText(value).width<=maxWidth)break;
    fontSize-=0.25;
  }
  return fontSize;
}
function addText(svg,text,x,y,{size=18,weight=700,anchor='start',maxWidth=0,minSize=11}={}){
  const value=String(text??'');
  const fontSize=maxWidth>0?fitSize(value,maxWidth,{size,weight,minSize}):size;
  const node=svgNode('text',{x,y,fill:'#000','font-family':'Tahoma, Leelawadee UI, Noto Sans Thai, Arial, sans-serif','font-size':fontSize,'font-weight':weight,'text-anchor':anchor,'dominant-baseline':'alphabetic'});
  node.textContent=value; svg.appendChild(node); return {node,fontSize};
}
function encodeCode128(text){
  const value=String(text??'');
  if(!value)throw new Error('ไม่มีข้อมูลบาร์โค้ด');
  const codeB=ch=>{
    const code=ch.charCodeAt(0)-32;
    if(code<0||code>94)throw new Error('Barcode รองรับอักขระมาตรฐานทั่วไปเท่านั้น');
    return code;
  };
  const digitRunLength=start=>{
    let n=0;
    while(start+n<value.length && /\d/.test(value[start+n])) n+=1;
    return n;
  };

  let i=0;
  const initialDigits=digitRunLength(0);
  // BarTender-style Auto: when a value starts with at least 4 digits,
  // pair digits from the LEFT in Code C. If one digit remains, switch to Code B.
  let currentSet=(initialDigits>=4 || (/^\d+$/.test(value) && initialDigits>=2)) ? 'C' : 'B';
  const codes=[currentSet==='C' ? 105 : 104];

  while(i<value.length){
    if(currentSet==='C'){
      const run=digitRunLength(i);
      if(run>=2){
        codes.push(Number(value.slice(i,i+2)));
        i+=2;
        continue;
      }
      codes.push(100); // switch C -> B
      currentSet='B';
      continue;
    }

    const run=digitRunLength(i);
    const reachesEnd=(i+run===value.length);
    // In the middle, Code C is worthwhile for 6+ digits; at the end, 4+ digits.
    if(run>=6 || (run>=4 && reachesEnd)){
      codes.push(99); // switch B -> C
      currentSet='C';
      continue;
    }

    codes.push(codeB(value[i]));
    i+=1;
  }

  let checksum=codes[0];
  for(let j=1;j<codes.length;j+=1)checksum+=codes[j]*j;
  checksum%=103;
  codes.push(checksum,106);
  return codes;
}

function barcodeRaster203(text){
  // Render Code 128 on exact 203 dpi printer dots to avoid fractional-width bars,
  // but keep the original physical width close to v1.4.70 so the preview does not look oversized.
  const codes=encodeCode128(text);
  const quietModules=10;
  const moduleDots=2; // 132 modules × 2 dots = 264 dots ≈ 33.0 mm, same feel as the original layout.
  let symbolModules=0;
  codes.forEach(code=>{symbolModules+=CODE128_PATTERNS[code].split('').reduce((sum,n)=>sum+Number(n),0);});
  const totalModules=symbolModules+(quietModules*2);
  const widthDots=totalModules*moduleDots;
  const heightDots=76; // 9.5 mm
  const canvas=document.createElement('canvas');
  canvas.width=widthDots; canvas.height=heightDots;
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,widthDots,heightDots);
  ctx.fillStyle='#000';
  let cursor=quietModules*moduleDots;
  codes.forEach(code=>{
    const pattern=CODE128_PATTERNS[code];
    for(let i=0;i<pattern.length;i+=1){
      const w=Number(pattern[i])*moduleDots;
      if(i%2===0)ctx.fillRect(cursor,0,w,heightDots);
      cursor+=w;
    }
  });
  return {dataUrl:canvas.toDataURL('image/png'),widthDots,heightDots,moduleDots,totalModules};
}
function addBarcode(svg,text,x,y){
  const raster=barcodeRaster203(text);
  const widthUnits=(raster.widthDots/8)*10;
  const heightUnits=(raster.heightDots/8)*10;
  const image=svgNode('image',{
    x,y,width:widthUnits,height:heightUnits,
    href:raster.dataUrl,
    preserveAspectRatio:'none'
  });
  image.style.imageRendering='pixelated';
  svg.appendChild(image);
  return {x,width:widthUnits,height:heightUnits,moduleDots:raster.moduleDots};
}
function makeLabel(row,payload){
  const page=document.createElement('div'); page.className='label-page';
  const svg=svgNode('svg',{class:'label-vector',viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none','aria-hidden':'true'});
  svg.appendChild(svgNode('rect',{x:0,y:0,width:W,height:H,fill:'#fff'}));

  const reserve=Boolean(payload.reserveRight);
  const left=18, top=12, contentRight=reserve?388:478, contentWidth=(reserve?388:478)-18;
  const sepX=reserve?399:null;

  const name=safeText(row?.name); const barcode=safeText(row?.barcode);
  addText(svg,'ชื่อน้ำยา',left+6,32,{size:15.5,weight:700,maxWidth:74,minSize:13});
  addText(svg,name,left+86,32,{size:21,weight:700,maxWidth:contentWidth-98,minSize:13});

  const barcodeX=left+10, barcodeY=44;
  const barcodeBox=addBarcode(svg,barcode,barcodeX,barcodeY);
  if(reserve)svg.appendChild(svgNode('line',{x1:sepX,y1:top,x2:sepX,y2:H-12,stroke:'#000','stroke-width':2}));
  addText(svg,barcode,left+(contentWidth/2),154,{size:15.4,weight:500,anchor:'middle',maxWidth:barcodeBox.width,minSize:12.6});

  addText(svg,`วันที่เปิด ${payload.openedDate} เวลา ${payload.openedTime}`,left+6,182,{size:16.6,weight:700,maxWidth:contentWidth-12,minSize:13.4});
  addText(svg,`วันหมดอายุ ${payload.expiryDate} เวลา ${payload.expiryTime}`,left+6,211,{size:16.6,weight:700,maxWidth:contentWidth-12,minSize:13.4});
  addText(svg,`ผู้เปิดใช้ ${payload.openedBy}`,left+6,240,{size:16.6,weight:700,maxWidth:contentWidth-12,minSize:13.4});
  addText(svg,payload.footer,left+(contentWidth/2),271,{size:11.2,weight:500,anchor:'middle',maxWidth:contentWidth-8,minSize:9.2});

  page.appendChild(svg); return page;
}
async function prepare(){
  const payload=getBatch();
  if(!payload.labels.length)throw new Error('ไม่มีรายการสำหรับพิมพ์');
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(_){} }
  payload.labels.forEach(row=>pages.appendChild(makeLabel(row,payload)));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  return payload;
}
async function startPrint(){
  try{
    const payload=await prepare();
    statusEl.innerHTML=`กำลังเปิดหน้าพิมพ์…<small>${payload.labels.length} ดวง · ขนาด 50 × 28 mm · Scale 100% / Actual size · Margin None</small>`;
    await new Promise(resolve=>setTimeout(resolve,180));
    window.focus(); window.print();
  }catch(e){statusEl.innerHTML=`${esc(e.message||'สร้างบาร์โค้ดไม่สำเร็จ')}<small>กรุณาปิดหน้านี้ แล้วกลับไปกดพิมพ์ใหม่</small>`; console.error(e);}
}
window.addEventListener('afterprint',()=>setTimeout(()=>window.close(),180));
window.addEventListener('load',()=>{if(p.get('auto')==='1')startPrint();else prepare().catch(console.error);},{once:true});
setTimeout(()=>{if(p.get('auto')==='1'&&!document.hidden)statusEl.innerHTML='หากหน้าพิมพ์ยังไม่เปิด กรุณากด Ctrl + P<small>เลือกกระดาษ 50 × 28 mm, Scale 100% / Actual size, Margin None และปิด Header/Footer</small>';},6000);
</script>
</body>
</html>
