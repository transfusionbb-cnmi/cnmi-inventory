<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>พิมพ์บาร์โค้ดน้ำยาเข้าเครื่อง</title>
<style>
*{box-sizing:border-box}
:root{--paper-w:50mm;--paper-h:28mm;--label-h:27.86mm}
html,body{margin:0;padding:0;width:var(--paper-w);background:#eef2f3;font-family:Tahoma,"Leelawadee UI","Noto Sans Thai",Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printPages{width:var(--paper-w);margin:0;padding:0;line-height:0}
.label-page{position:relative;display:block;width:var(--paper-w);height:var(--label-h);margin:0;padding:0;background:#fff;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.label-inner{position:absolute;left:2mm;right:2mm;top:1mm;bottom:1mm;padding:0;display:block;background:#fff}
.label-main{position:absolute;left:0;top:0;bottom:0;right:0;display:block;padding:0}
.label-page.reserve .label-main{right:10mm;border-right:.32mm solid #000;padding-right:1.2mm}
.reserve-box{display:none}.label-page.reserve .reserve-box{display:block;position:absolute;top:0;right:0;width:10mm;bottom:0}
.name-line{display:flex;align-items:flex-end;gap:1.2mm;height:3.6mm;margin-bottom:.35mm;overflow:hidden}
.name-label{font-size:2.15mm;font-weight:700;white-space:nowrap;line-height:1}
.name-value{font-size:2.25mm;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.barcode-wrap{height:7.25mm;display:flex;align-items:stretch;justify-content:center}
.barcode-wrap svg{width:100%;height:100%;display:block}
.barcode-text{margin-top:.15mm;text-align:center;font-size:2.05mm;font-weight:700;line-height:1.1;letter-spacing:.05mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.write-section{margin-top:.6mm;display:grid;gap:.45mm}
.write-row{display:flex;align-items:flex-end;gap:.55mm;font-size:1.7mm;line-height:1.15}
.write-row .label{font-weight:700;white-space:nowrap}
.write-row .dots{flex:1;min-width:6mm;border-bottom:.28mm dotted #000;height:0;transform:translateY(-.55mm)}
.write-row .time-label{min-width:auto}
.write-row .dots.short{flex:0 0 9mm}
.write-row.user .dots{flex:1}
.footer{position:absolute;left:0;right:0;bottom:.15mm;text-align:center;font-size:1.35mm;line-height:1.05;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-status{position:fixed;left:54mm;top:6mm;width:420px;padding:14px 16px;border-radius:12px;background:#fff;color:#087b6f;box-shadow:0 8px 28px rgba(0,0,0,.16);font-size:13px;font-weight:700;line-height:1.45}
.screen-status small{display:block;margin-top:4px;color:#667a76;font-weight:500}
@page{size:50mm 28mm;margin:0}
@media print{
  html,body{width:var(--paper-w)!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important;line-height:0!important}
  #printPages{width:var(--paper-w)!important;margin:0!important;padding:0!important;line-height:0!important}
  .label-page{display:block!important;width:var(--paper-w)!important;height:var(--label-h)!important;margin:0!important;padding:0!important}
  .screen-status{display:none!important}
}
</style>
</head>
<body>
<div id="printPages"></div>
<div class="screen-status" id="screenStatus">กำลังสร้างบาร์โค้ดน้ำยาเข้าเครื่อง…</div>
<script>
'use strict';
const p = new URLSearchParams(location.search);
const batchKey = p.get('batch') || '';
const pages = document.getElementById('printPages');
const statusEl = document.getElementById('screenStatus');
const CODE128_PATTERNS = [
'212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'
];

function esc(text){return String(text ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeText(value, fallback='-'){const text = String(value ?? '').trim(); return text || fallback;}
function getBatch(){
  if (!batchKey) throw new Error('ไม่พบข้อมูลชุดพิมพ์');
  const raw = localStorage.getItem(batchKey);
  if (!raw) throw new Error('ข้อมูลชุดพิมพ์หมดอายุหรือไม่พบ กรุณากลับไปกดพิมพ์ใหม่');
  try {
    const parsed = JSON.parse(raw);
    return {
      reserveRight: parsed?.reserveRight !== false,
      labels: Array.isArray(parsed?.labels) ? parsed.labels : [],
      footer: safeText(parsed?.footer, 'FM-CNCPL-034 Rev.00 วันบังคับใช้ 1 สิงหาคม 2562')
    };
  } finally {
    localStorage.removeItem(batchKey);
  }
}
function encodeCode128B(text){
  const value = String(text ?? '');
  if (!value) throw new Error('ไม่มีข้อมูลบาร์โค้ด');
  const codes = [104];
  for (const ch of value){
    const code = ch.charCodeAt(0) - 32;
    if (code < 0 || code > 94) throw new Error('Barcode รองรับอักขระมาตรฐานทั่วไปเท่านั้น');
    codes.push(code);
  }
  let checksum = codes[0];
  for (let i=1;i<codes.length;i+=1) checksum += codes[i] * i;
  checksum %= 103;
  codes.push(checksum, 106);
  return codes;
}
function barcodeSvg(text){
  const codes = encodeCode128B(text);
  const quiet = 10;
  let x = quiet;
  const bars = [];
  codes.forEach(code => {
    const pattern = CODE128_PATTERNS[code];
    for (let i=0;i<pattern.length;i+=1){
      const width = Number(pattern[i]);
      if (i % 2 === 0) bars.push(`<rect x="${x}" y="0" width="${width}" height="72" fill="#000"/>`);
      x += width;
    }
  });
  const totalWidth = x + quiet;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} 72" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="${totalWidth}" height="72" fill="#fff"/>${bars.join('')}</svg>`;
}
function makeLabel(row, reserveRight, footer){
  const page = document.createElement('div');
  page.className = `label-page${reserveRight ? ' reserve' : ''}`;
  const name = safeText(row?.name);
  const barcodeValue = safeText(row?.barcode);
  page.innerHTML = `<div class="label-inner"><div class="label-main"><div class="name-line"><span class="name-label">ชื่อน้ำยา</span><span class="name-value">${esc(name)}</span></div><div class="barcode-wrap">${barcodeSvg(barcodeValue)}</div><div class="barcode-text">${esc(barcodeValue)}</div><div class="write-section"><div class="write-row"><span class="label">วันที่เปิด</span><span class="dots"></span><span class="label time-label">เวลา</span><span class="dots short"></span></div><div class="write-row"><span class="label">วันหมดอายุ</span><span class="dots"></span><span class="label time-label">เวลา</span><span class="dots short"></span></div><div class="write-row user"><span class="label">ผู้เปิดใช้</span><span class="dots"></span></div></div><div class="footer">${esc(footer)}</div></div><div class="reserve-box" aria-hidden="true"></div></div>`;
  return page;
}
async function prepare(){
  const payload = getBatch();
  if (!payload.labels.length) throw new Error('ไม่มีรายการสำหรับพิมพ์');
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (_) {} }
  payload.labels.forEach(row => pages.appendChild(makeLabel(row, payload.reserveRight, payload.footer)));
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  return payload;
}
async function startPrint(){
  try {
    const payload = await prepare();
    statusEl.innerHTML = `กำลังเปิดหน้าพิมพ์…<small>${payload.labels.length} ดวง · ขนาด 50 × 28 mm · Scale 100% / Actual size</small>`;
    await new Promise(resolve => setTimeout(resolve, 180));
    window.focus();
    window.print();
  } catch (e) {
    statusEl.innerHTML = `${esc(e.message || 'สร้างบาร์โค้ดไม่สำเร็จ')}<small>กรุณาปิดหน้านี้ แล้วกลับไปกดพิมพ์ใหม่</small>`;
    console.error(e);
  }
}
window.addEventListener('afterprint', () => setTimeout(() => window.close(), 180));
window.addEventListener('load', () => { if (p.get('auto') === '1') startPrint(); else prepare().catch(console.error); }, {once:true});
setTimeout(() => {
  if (p.get('auto') === '1' && !document.hidden) statusEl.innerHTML = 'หากหน้าพิมพ์ยังไม่เปิด กรุณากด Ctrl + P<small>เลือกกระดาษ 50 × 28 mm, Scale 100% / Actual size, ปิด Header/Footer และใช้ Margin None</small>';
}, 6000);
</script>
</body>
</html>
